<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Under-review paper visual placeholder</title>
  <desc id="desc">A neutral blue placeholder that does not disclose the manuscript identity.</desc>
  <rect width="640" height="360" rx="28" fill="#f3f6fb"/>
  <rect x="168" y="40" width="304" height="244" rx="20" fill="#fff" stroke="#b8cbe6" stroke-width="3"/>
  <path d="M220 104h200M220 145h200M220 186h138" stroke="#7699c8" stroke-width="12" stroke-linecap="round"/>
  <rect x="250" y="218" width="140" height="42" rx="21" fill="#1e4f91"/>
  <text x="320" y="246" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="2">IN REVIEW</text>
  <text x="320" y="326" fill="#173b67" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="2">PAPER VISUAL</text>
</svg>
